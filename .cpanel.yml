---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/repositories/mayelin
    - export NODE_ENV=production
    - /bin/bash -lc 'cd "$DEPLOYPATH" || exit 0; for v in 22 20 18; do for p in "$HOME/nodevenv/repositories/mayelin/$v/bin/activate" "$HOME/nodevenv/mayelin_ao/$v/bin/activate" "$HOME/nodevenv/repositories/mayelin/$v"/*/bin/activate; do [ -f "$p" ] && . "$p" 2>/dev/null && break 2; done; done; echo "node=$(command -v node 2>/dev/null || echo none) npm=$(command -v npm 2>/dev/null || echo none)"; npm install --legacy-peer-deps --no-audit --no-fund --omit=dev || npm install --legacy-peer-deps --no-audit --no-fund || echo "npm install skipped/failed (prebuilt bundle may still run)"'
    - /bin/bash -lc 'cd "$DEPLOYPATH" || exit 0; if [ ! -f dist/index.html ] || [ ! -f dist-server/index.js ]; then for v in 22 20 18; do for p in "$HOME/nodevenv/repositories/mayelin/$v/bin/activate" "$HOME/nodevenv/mayelin_ao/$v/bin/activate" "$HOME/nodevenv/repositories/mayelin/$v"/*/bin/activate; do [ -f "$p" ] && . "$p" 2>/dev/null && break 2; done; done; npm run build || echo "Build skipped/failed - using prebuilt files if present"; fi; ls -la dist-server/index.js dist/index.html 2>/dev/null || true'
